name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Le SDK Android est déjà installé sur ubuntu-latest : on accepte seulement les licences
      - name: Accepter les licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compiler l'APK signé
        run: gradle assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=1.${{ github.run_number }}
      - name: Préparer le fichier
        run: cp app/build/outputs/apk/release/app-release.apk clavier.apk
      - uses: actions/upload-artifact@v4
        with:
          name: clavier-apk
          path: clavier.apk
      # La publication déclenche la mise à jour automatique des appareils qui ont déjà l'appli
      - name: Publier la version (GitHub Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ github.run_number }}"
          gh release create "$TAG" clavier.apk --title "Version 1.${{ github.run_number }}" --notes "Mise à jour automatique du clavier (version 1.${{ github.run_number }})." --latest \
            || gh release upload "$TAG" clavier.apk --clobber
