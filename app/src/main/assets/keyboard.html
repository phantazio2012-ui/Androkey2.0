<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Clavier CGSI</title>
<style>
:root{--bg:#06265f;--bg2:#1457c8;--k1:#2f6fe0;--k2:#1b4fb5;--kd:#0f3278;--f1:#173f8f;--f2:#0f2f70;--txt:#fff;--accent:#ffb300;--bar:rgba(255,255,255,.10);--bd:rgba(255,255,255,.18);--pan:#0a2f72}
[data-theme=sombre]{--bg:#0a0a0c;--bg2:#2a2a33;--k1:#3a3a44;--k2:#26262d;--kd:#101014;--f1:#1c1c22;--f2:#121216;--txt:#eee;--accent:#00e0c0;--pan:#17171c}
[data-theme=vert]{--bg:#063a1d;--bg2:#17894a;--k1:#2aa860;--k2:#1b8648;--kd:#0c4c28;--f1:#146b38;--f2:#0d5028;--accent:#ffd54f;--pan:#0a4423}
[data-theme=rose]{--bg:#4a0d2f;--bg2:#c2397f;--k1:#dc4f96;--k2:#b02f74;--kd:#6d1646;--f1:#8e2560;--f2:#6c1a49;--accent:#ffe082;--pan:#5e1239}
[data-theme=clair]{--bg:#cfd5e4;--bg2:#f4f6fb;--k1:#fff;--k2:#e6e9f2;--kd:#b3b9cb;--f1:#d5daea;--f2:#c3c9db;--txt:#1a1a1a;--accent:#1e5fd1;--bar:rgba(0,0,0,.07);--bd:rgba(0,0,0,.12);--pan:#e9ecf5}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;
  background:radial-gradient(120% 90% at 15% 0%,var(--bg2) 0%,var(--bg) 62%) fixed}
#app{display:flex;flex-direction:column;height:100dvh;padding:8px;gap:8px}
#bar{position:relative;z-index:20;display:flex;gap:8px;align-items:center;background:var(--bar);border:1px solid var(--bd);border-radius:16px;padding:6px 8px 6px 14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#bar .sp{flex:1}
button{font-family:inherit;color:var(--txt)}
button.t{background:var(--bar);border:1px solid var(--bd);border-radius:12px;padding:9px 14px;font-size:15px;font-weight:600}
button.t:active{filter:brightness(1.25)}
select{background:var(--bar);color:var(--txt);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;font-size:15px;font-family:inherit}
select option{color:#111}
#btn{background:linear-gradient(180deg,#34d070,#17a04c);color:#fff;border:0;box-shadow:0 3px 10px rgba(0,0,0,.3);padding:9px 22px;font-size:16px}
#btn.off{background:linear-gradient(180deg,#ef5350,#c62828)}
#bt{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;min-width:0}
#btx{white-space:normal;line-height:1.2;font-size:14px}
#dot{width:14px;height:14px;border-radius:50%;background:#e53935;box-shadow:0 0 0 4px rgba(229,57,53,.25);flex:none}
#bt.on #dot{background:#43d17a;box-shadow:0 0 0 4px rgba(67,209,122,.28),0 0 12px #43d17a}
.ind{position:relative;width:44px;height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--bar);font-size:20px;font-weight:700;padding:0}
.ind::after{content:"";position:absolute;left:8px;right:8px;bottom:4px;height:4px;border-radius:2px;background:var(--bd)}
.ind.on{background:linear-gradient(180deg,var(--k1),var(--k2))}
.ind.on::after{background:var(--accent);box-shadow:0 0 8px var(--accent)}
#set{font-size:22px;line-height:1;padding:8px 13px}
#panel{position:absolute;right:0;top:calc(100% + 8px);z-index:10;width:min(480px,100%);max-height:calc(100dvh - 90px);overflow:auto;background:var(--pan);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 18px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:7px}
.f>label,.f>.l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.inl{display:flex;gap:8px;flex-wrap:wrap}
.inl select{flex:1;min-width:0}
.sw{display:flex;gap:12px;flex-wrap:wrap}
.sw button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.sw button.sel{border-color:var(--accent);transform:scale(1.1)}
.chk{display:flex;align-items:center;gap:10px;font-size:15px}
input[type=range]{width:100%}
#out{background:var(--bar);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;min-height:56px;max-height:22vh;overflow:auto;white-space:pre-wrap;font-size:18px}
#kb{flex:1;display:flex;flex-direction:column;gap:7px;min-height:0}
.row{flex:1;display:flex;gap:6px;min-height:0}
.k{position:relative;min-width:0;color:var(--txt);border:1px solid var(--bd);border-radius:12px;padding:0;overflow:hidden;
  background:linear-gradient(180deg,var(--k1),var(--k2));
  box-shadow:0 4px 0 var(--kd),0 8px 14px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .05s,box-shadow .05s,filter .05s;touch-action:manipulation;text-shadow:0 1px 1px rgba(0,0,0,.25)}
[data-theme=clair] .k{text-shadow:none}
.k:active{transform:translateY(3px);box-shadow:0 1px 0 var(--kd),0 0 18px color-mix(in srgb,var(--accent) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.3);filter:brightness(1.18)}
.k .m{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,4.4vmin,34px);font-weight:600}
.k.sym .m{justify-content:flex-start;align-items:flex-end;padding:0 0 6% 14%;font-size:clamp(15px,3.9vmin,30px)}
.k .s{position:absolute;left:14%;top:6%;font-size:clamp(10px,2.4vmin,17px);opacity:.85;font-weight:500}
.k .a{position:absolute;right:9%;bottom:6%;font-size:clamp(10px,2.4vmin,17px);color:var(--accent);font-weight:700;text-shadow:none}
.k.fn{background:linear-gradient(180deg,var(--f1),var(--f2))}
.k.fn .m{font-size:clamp(11px,2.6vmin,20px)}
.k.big .m{font-size:clamp(18px,5vmin,40px)}
.k.act{background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000));color:#111;text-shadow:none;box-shadow:0 4px 0 var(--kd),0 0 20px color-mix(in srgb,var(--accent) 60%,transparent)}
.k.mode{background:linear-gradient(180deg,#1b2fb0,#0a1670);color:#fff;font-weight:800}
.k.mode .m{font-size:clamp(9px,2.3vmin,17px);letter-spacing:.03em;text-align:center;line-height:1.15;flex-direction:column}
.k.logo{background:#fff}
.k.logo img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;pointer-events:none}
#upd{display:flex;align-items:center;gap:10px;background:var(--accent);color:#111;border-radius:12px;padding:5px 6px 5px 14px;font-weight:700;font-size:14px}
#upd .t{background:#111;color:#fff;border:0;padding:7px 14px;margin-left:auto}
#dgout{margin:0;white-space:pre-wrap;font-size:12px;line-height:1.5;background:rgba(0,0,0,.25);border-radius:10px;padding:8px;min-height:20px;user-select:text;-webkit-user-select:text}
/* --- mode souris --- */
#kb.mouse{gap:8px}
.mtop{flex:1;display:flex;gap:8px;min-height:0}
.pad{flex:1;border-radius:18px;border:1px solid var(--bd);background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));display:flex;align-items:center;justify-content:center;text-align:center;touch-action:none;font-size:clamp(13px,3vmin,20px);opacity:.95;line-height:1.5;padding:12px}
.pad small{display:block;opacity:.7;font-size:.8em}
.scr{width:clamp(70px,13vw,120px);border-radius:18px;border:1px solid var(--bd);background:repeating-linear-gradient(180deg,rgba(255,255,255,.16) 0 6px,rgba(255,255,255,.04) 6px 14px);touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 0;font-size:clamp(11px,2.6vmin,16px);font-weight:700}
.mbot{flex:0 0 28%;display:flex;gap:8px}
.mbot .k{flex:1}
.mbot .k.big2{flex:2}
</style>
</head>
<body data-theme="bleu">
<div id="app">
  <div id="bar">
    <div id="bt"><span id="dot"></span><span id="btx">Non connecté</span></div>
    <div class="sp"></div>
    <button class="t" id="btn">Connecter</button>
    <button class="ind" id="ind1" title="Pavé numérique">1</button>
    <button class="ind" id="ind2" title="Verrouillage majuscules">A</button>
    <button class="t" id="set" aria-label="Paramètres" title="Paramètres">⚙</button>
    <div id="panel" hidden>
      <div class="f"><label for="lay">Disposition</label>
        <select id="lay"><option>AZERTY</option><option>QWERTY</option><option>QWERTZ</option></select>
      </div>
      <div class="f"><span class="l">Thème de couleur</span><div class="sw" id="sw"></div></div>
      <div class="f" id="devbox"><label for="dev">Appareil Bluetooth (déjà appairé)</label>
        <div class="inl"><select id="dev"></select>
          <button class="t" id="refresh">Actualiser</button>
          <button class="t" id="disc">Rendre visible</button></div>
      </div>
      <div class="f"><label for="speed">Vitesse de la souris</label><input type="range" id="speed" min="0.5" max="4" step="0.1"></div>
      <div class="chk"><input type="checkbox" id="invx"><label for="invx">Mouvement : inverser gauche/droite</label></div>
      <div class="chk"><input type="checkbox" id="invy"><label for="invy">Mouvement : inverser haut/bas</label></div>
      <div class="chk"><input type="checkbox" id="invs"><label for="invs">Molette : inverser le sens</label></div>
      <div class="chk"><input type="checkbox" id="showout"><label for="showout">Afficher la zone de texte</label></div>
      <div class="f" id="updsec"><span class="l" id="verline">Mises à jour</span>
        <div class="inl"><button class="t" id="updcheck">Rechercher une mise à jour</button></div>
        <div id="updmsg" style="font-size:13px;opacity:.9"></div></div>
      <div class="f" id="dgsec"><span class="l">Diagnostic Bluetooth</span>
        <div class="inl"><button class="t" id="dg">Diagnostic</button><button class="t" id="mt">Tester la souris</button></div>
        <div class="inl"><button class="t" id="unp">Oublier cet ordinateur</button><button class="t" id="btset">Réglages Bluetooth</button></div>
        <pre id="dgout"></pre></div>
      <div class="f" id="fsbox"><button class="t" id="fs">Plein écran</button></div>
    </div>
  </div>
  <div id="upd" hidden><span id="updtx"></span><button class="t" id="updbtn">Installer</button></div>
  <div id="out"></div>
  <div id="kb"></div>
</div>

/* ---------- Envoi vers Android / aperçu ---------- */
function sendKey(code, mods) { if (NATIVE) { try { Android.sendKey(code, mods); } catch(e) {} } }
let mhint = null, lastMouseResult = null;
function sendMouse(dx, dy, w, b) {
  if (!NATIVE) return;
  let r = -2;
  try { if (typeof Android.mouse === "function") r = Android.mouse(dx, dy, w, b); } catch(e) { r = -2; }
  lastMouseResult = r;
  if (!mhint) return r;
  mhint.textContent = r === 1 ? "" :
    r === 0 ? "⚠ Aucun ordinateur connecté : appuyez sur Connecter" :
    r === -1 ? "⚠ Le Bluetooth a refusé l'envoi : reconnectez l'ordinateur" :
    "⚠ L'application Android n'est pas à jour (souris absente) : remplacez les fichiers .kt puis recompilez";
  return r;
}
function preview(t) {
  if (t === "BACK") S.text = S.text.slice(0, -1); else S.text += t;
  $("out").textContent = S.text; $("out").scrollTop = 1e9;
}
function curMods(letter) {
  const shiftEff = S.shift !== (S.caps && !!letter);
  return (shiftEff ? SH : 0) | (S.ctrl ? CT : 0) | (S.alt ? AL : 0) | (S.win ? WI : 0) | (S.altgr ? AG : 0);
}
function clearOneShot() {
  if (S.shift || S.ctrl || S.alt || S.win || S.altgr) { S.shift = S.ctrl = S.alt = S.win = S.altgr = false; refreshAll(); }
}
const CH = {}; // caractère -> [code, modificateurs] pour la disposition courante
function buildCharMap() {
  for (const k in CH) delete CH[k];
  LAYOUTS[S.lay].flat().forEach(k => {
    if (k.sp) return;
    if (k.b && !CH[k.b]) CH[k.b] = [k.c, 0];
    if (k.s && !CH[k.s]) CH[k.s] = [k.c, SH];
    if (k.a && !CH[k.a]) CH[k.a] = [k.c, AG];
  });
  CH[" "] = [0x2C, 0];
}
function typeChar(ch) { const t = CH[ch]; if (!t) return; sendKey(t[0], t[1]); preview(ch); }

/* ---------- Libellés dynamiques ---------- */
function labels(k) {
  const ag = S.altgr && k.a, shiftOn = S.shift;
  let main, top = "", alt = "";
  if (k.l) { main = ag ? k.a : k.s; alt = (!S.altgr && k.a) ? k.a : ""; }
  else {
    if (ag) main = k.a; else if (shiftOn && k.s) main = k.s; else main = k.b;
    if (!ag && k.s) top = shiftOn ? k.b : k.s;
    if (!ag && k.a) alt = k.a;
  }
  return {main, top, alt};
}
function previewChar(k) {
  const letter = !!k.l, shiftEff = S.shift !== (S.caps && letter);
  if (S.altgr && k.a) return k.a;
  if (letter) return shiftEff ? k.s : k.b;
  return (S.shift && k.s) ? k.s : k.b;
}

/* ---------- Construction du clavier ---------- */
let UPD = [];
function refreshAll() { UPD.forEach(f => f()); $("ind1").classList.toggle("on", S.mode === "num"); $("ind2").classList.toggle("on", S.caps); }
function div(cls) { const d = document.createElement("div"); d.className = cls; return d; }

function holdable(b, fn, repeat) {
  let t = null, iv = null;
  const stop = () => { clearTimeout(t); clearInterval(iv); t = iv = null; };
  b.addEventListener("pointerdown", e => { e.preventDefault(); fn(); if (repeat) { t = setTimeout(() => { iv = setInterval(fn, 70); }, 420); } });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => b.addEventListener(ev, stop));
  b.addEventListener("contextmenu", e => e.preventDefault());
}

function normalKey(k) {
  const b = document.createElement("button");
  b.className = "k" + (k.l ? "" : " sym"); b.style.flex = k.w;
  const s = document.createElement("span"), m = document.createElement("span"), a = document.createElement("span");
  s.className = "s"; m.className = "m"; a.className = "a"; b.append(s, m, a);
  const upd = () => { const L = labels(k); s.textContent = L.top; m.textContent = L.main; a.textContent = L.alt; };
  upd(); UPD.push(upd);
  holdable(b, () => {
    const mods = curMods(k.l), plain = !(S.ctrl || S.alt || S.win);
    const ch = previewChar(k);
    sendKey(k.c, mods);
    if (plain) preview(ch);
    clearOneShot();
  }, false);
  return b;
}

function specialKey(def) {
  const d = SPECIAL[def.sp];
  const b = document.createElement("button");
  b.className = "k " + (d.cls || ""); b.style.flex = def.w;
  const m = document.createElement("span"); m.className = "m"; b.append(m);
  if (d.logo) { const im = document.createElement("img"); im.src = LOGO; im.alt = "CGSI"; b.append(im); }
  else m.innerHTML = d.lab;
  if (d.sticky) {
    const st = d.sticky;
    const upd = () => b.classList.toggle("act", !!S[st]); upd(); UPD.push(upd);
    b.addEventListener("pointerdown", e => {
      e.preventDefault();
      if (st === "shift") { if (S.shift) { S.shift = false; S.caps = true; } else if (S.caps) S.caps = false; else S.shift = true; }
      else S[st] = !S[st];
      refreshAll();
    });
  } else if (d.go) {
    b.addEventListener("pointerdown", e => { e.preventDefault(); setMode(d.go); });
  } else if (d.logo) {
    b.addEventListener("pointerdown", e => { e.preventDefault(); openUrl(CGSI_URL); });
  } else {
    holdable(b, () => {
      const plain = !(S.ctrl || S.alt || S.win);
      sendKey(d.code, curMods(false) & ~SH | (def.sp === "space" || def.sp === "enter" ? 0 : (S.shift ? SH : 0)));
      if (plain) {
        if (def.sp === "back") preview("BACK"); else if (def.sp === "enter") preview("\n");
        else if (def.sp === "space") preview(" "); else if (def.sp === "tab") preview("\t");
      }
      clearOneShot();
    }, !!d.rep);
  }
  return b;
}

function buildKb(kb) {
  LAYOUTS[S.lay].forEach(r => {
    const row = div("row");
    r.forEach(k => row.append(k.sp ? specialKey(k) : normalKey(k)));
    kb.append(row);
  });
}

/* ---------- Pavé numérique ---------- */
const NUMPAD = [
  [{t:"mode",l:"ABC",go:"kb"},{kp:0x54,l:"/"},{kp:0x55,l:"×"},{kp:0x56,l:"−"},{t:"back",l:"⌫"}],
  [{ch:"7"},{ch:"8"},{ch:"9"},{kp:0x57,l:"+"},{ch:"(",l:"("}],
  [{ch:"4"},{ch:"5"},{ch:"6"},{ch:"=",l:"="},{ch:")",l:")"}],
  [{ch:"1"},{ch:"2"},{ch:"3"},{ch:".",l:"."},{ch:"%",l:"%"}],
  [{ch:"0",w:2},{ch:",",l:","},{kp:0x58,l:"↵",w:2,enter:1}]
];
function buildNum(kb) {
  NUMPAD.forEach(r => {
    const row = div("row");
    r.forEach(d => {
      const b = document.createElement("button");
      b.className = "k big" + ((d.kp || d.t || d.go) ? " fn" : ""); b.style.flex = d.w || 1;
      const m = document.createElement("span"); m.className = "m"; m.textContent = d.l || d.ch; b.append(m);
      if (d.go) b.className += " mode";
      holdable(b, () => {
        if (d.go) { setMode(d.go); return; }
        if (d.t === "back") { sendKey(0x2A, 0); preview("BACK"); return; }
        if (d.kp) { sendKey(d.kp, 0); preview(d.enter ? "\n" : d.l === "×" ? "*" : d.l === "−" ? "-" : d.l); return; }
        typeChar(d.ch);
      }, d.t === "back");
      row.append(b);
    });
    kb.append(row);
  });
}

/* ---------- Mode souris ---------- */
function mbtn(cls, html, fn) { const b = document.createElement("button"); b.className = "k " + cls; const m = document.createElement("span"); m.className = "m"; m.innerHTML = html; b.append(m); fn(b); return b; }
function buildMouse(kb) {
  kb.classList.add("mouse");
  const top = div("mtop");
  const pad = div("pad"); pad.innerHTML = "<div>Pavé tactile<small>1 doigt : déplacer · toucher : clic gauche<br>2 doigts : clic droit · glisser : défiler</small><b id=\"mhint\" style=\"display:block;margin-top:8px;color:var(--accent)\"></b></div>"; mhint = pad.querySelector("#mhint");
  const scr = div("scr"); scr.innerHTML = "<span>▲</span><span>MOLETTE</span><span>▼</span>";
  top.append(pad, scr);

  let accX = 0, accY = 0, accW = 0;
  const flush = (dx, dy, w) => { if (dx || dy || w) sendMouse(dx, dy, w, S.btn); };
  const move = (dx, dy) => { accX += dx * S.speed; accY += dy * S.speed; const ix = Math.trunc(accX), iy = Math.trunc(accY); accX -= ix; accY -= iy; flush(ix, iy, 0); };
  const wheel = dy => { accW += (S.invS ? -dy : dy) / 14; const w = Math.trunc(accW); accW -= w; if (w) sendMouse(0, 0, w, S.btn); };
  const click = bit => { sendMouse(0, 0, 0, S.btn | bit); setTimeout(() => sendMouse(0, 0, 0, S.btn), 45); };

  const pts = new Map(); let t0 = 0, moved = 0, maxP = 0;
  pad.addEventListener("pointerdown", e => {
    pad.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (pts.size === 1) { t0 = performance.now(); moved = 0; maxP = 1; } else maxP = Math.max(maxP, pts.size);
  });
  pad.addEventListener("pointermove", e => {
    const p = pts.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
    if (pts.size >= 2) { if (e.isPrimary) wheel(dy); } else move(dx, dy);
  });
  const end = e => {
    if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
    if (pts.size === 0) { if (performance.now() - t0 < 260 && moved < 12) click(maxP >= 2 ? 2 : 1); maxP = 0; }
  };
  pad.addEventListener("pointerup", end); pad.addEventListener("pointercancel", end);

  let sy = null, smoved = 0, st0 = 0;
  scr.addEventListener("pointerdown", e => { scr.setPointerCapture(e.pointerId); sy = e.clientY; smoved = 0; st0 = performance.now(); });
  scr.addEventListener("pointermove", e => { if (sy === null) return; const dy = e.clientY - sy; sy = e.clientY; smoved += Math.abs(dy); wheel(dy); });
  const sEnd = () => { if (sy !== null && smoved < 8 && performance.now() - st0 < 260) click(4); sy = null; };
  scr.addEventListener("pointerup", sEnd); scr.addEventListener("pointercancel", sEnd);

  const bot = div("mbot");
  const press = bit => b => {
    b.addEventListener("pointerdown", e => { e.preventDefault(); b.setPointerCapture(e.pointerId); S.btn |= bit; sendMouse(0, 0, 0, S.btn); });
    const up = () => { if (S.btn & bit) { S.btn &= ~bit; sendMouse(0, 0, 0, S.btn); } };
    b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up);
  };
  const air = mbtn("fn", "⟲ Mouvement", b => {
    const upd = () => b.classList.toggle("act", S.air); upd(); UPD.push(upd);
    b.addEventListener("pointerdown", e => { e.preventDefault(); setAir(!S.air); });
  });
  bot.append(mbtn("big2", "Clic gauche", press(1)), mbtn("big2", "Clic droit", press(2)), air,
    mbtn("mode", "⌨<br>CLAVIER", b => b.addEventListener("pointerdown", e => { e.preventDefault(); setMode("kb"); })));
  kb.append(top, bot);
}
function setAir(on) {
  if (on) {
    let ok = true;
    if (NATIVE) { try { ok = Android.gyro(true, S.speed, S.invX, S.invY); } catch(e) { ok = false; } }
    else { window.onBtMsg("Mouvement : disponible dans l'application Android"); ok = false; }
    S.air = !!ok;
    if (NATIVE && !ok) window.onBtMsg("Pas de gyroscope sur cet appareil");
  } else { S.air = false; if (NATIVE) { try { Android.gyro(false, S.speed, S.invX, S.invY); } catch(e) {} } }
  refreshAll();
}
window.onGyroOff = () => { S.air = false; refreshAll(); };

/* ---------- Modes / rendu ---------- */
function setMode(m) {
  if (S.mode === "mouse" && m !== "mouse") setAir(false);
  S.mode = (m === S.mode && m === "num") ? "kb" : m;
  if (S.btn) { S.btn = 0; sendMouse(0, 0, 0, 0); }
  render();
}
function render() {
  document.body.dataset.theme = S.thm; $("lay").value = S.lay;
  $("showout").checked = S.showOut; $("out").hidden = !S.showOut;
  $("speed").value = S.speed; $("invx").checked = S.invX; $("invy").checked = S.invY; $("invs").checked = S.invS;
  document.querySelectorAll("#sw button").forEach(b => b.classList.toggle("sel", b.dataset.t === S.thm));
  buildCharMap();
  const kb = $("kb"); kb.innerHTML = ""; kb.className = ""; UPD = [];
  try {
    if (S.mode === "num") buildNum(kb); else if (S.mode === "mouse") buildMouse(kb); else buildKb(kb);
  } catch (err) {
    S.mode = "kb"; kb.innerHTML = ""; kb.className = ""; UPD = []; buildKb(kb);
    window.onBtMsg("Erreur : " + (err && err.message));
  }
  refreshAll();
}
function openUrl(u) { if (NATIVE) { try { Android.openUrl(u); } catch(e) {} } else window.open(u, "_blank"); }

/* ---------- Bluetooth ---------- */
function renderBt() {
  $("bt").classList.toggle("on", S.bt);
  $("btx").textContent = S.bt ? "Connecté à : " + (S.btName || "ordinateur") : (S.btMsg || "Non connecté");
  $("btn").textContent = S.bt ? "Déconnecter" : "Connecter"; $("btn").classList.toggle("off", S.bt);
}
window.onBtState = (on, name) => { S.bt = !!on; S.btName = name || ""; S.btMsg = ""; renderBt(); };
window.onBtMsg = m => { S.btMsg = m; if (!S.bt) renderBt(); };
function refreshDevices() {
  const sel = $("dev"); sel.innerHTML = ""; let list = [];
  if (NATIVE) { try { list = JSON.parse(Android.getDevices()); } catch(e) {} }
  else list = [{name:"Mon ordinateur (simulation)", address:"sim"}];
  if (!list.length) { const o = document.createElement("option"); o.value = ""; o.textContent = "Aucun appareil appairé"; sel.append(o); }
  list.forEach(d => { const o = document.createElement("option"); o.value = d.address; o.textContent = d.name || d.address; sel.append(o); });
  if (list.some(d => d.address === S.dev)) sel.value = S.dev; else S.dev = sel.value;
}
$("btn").onclick = () => {
  if (S.bt) { if (NATIVE) Android.disconnect(); else window.onBtState(false, ""); return; }
  if (!S.dev) { $("panel").hidden = false; refreshDevices(); return; }
  if (NATIVE) Android.connect(S.dev); else window.onBtState(true, $("dev").selectedOptions[0].textContent);
};
$("dev").onchange = e => { S.dev = e.target.value; save(); };
$("refresh").onclick = refreshDevices;
$("disc").onclick = () => { if (NATIVE) Android.discoverable(); else alert("Disponible dans l'application Android."); };

/* ---------- Paramètres ---------- */
THEMES.forEach(([id, name, c1, c2]) => {
  const b = document.createElement("button"); b.dataset.t = id; b.title = name; b.style.background = `linear-gradient(135deg,${c1},${c2})`;
  b.onclick = () => { S.thm = id; save(); render(); }; $("sw").append(b);
});
$("set").onclick = e => { e.stopPropagation(); $("panel").hidden = !$("panel").hidden; if (!$("panel").hidden) refreshDevices(); };
$("panel").onclick = e => e.stopPropagation();
document.addEventListener("click", () => { $("panel").hidden = true; });
$("lay").onchange = e => { S.lay = e.target.value; save(); render(); };
$("showout").onchange = e => { S.showOut = e.target.checked; save(); render(); };
const airSync = () => { if (S.air && NATIVE) { try { Android.gyro(true, S.speed, S.invX, S.invY); } catch(e) {} } };
$("speed").oninput = e => { S.speed = parseFloat(e.target.value); save(); airSync(); };
$("invx").onchange = e => { S.invX = e.target.checked; save(); airSync(); };
$("invy").onchange = e => { S.invY = e.target.checked; save(); airSync(); };
$("invs").onchange = e => { S.invS = e.target.checked; save(); };
$("ind1").onclick = () => setMode(S.mode === "num" ? "kb" : "num");
$("ind2").onclick = () => { S.caps = !S.caps; refreshAll(); };
if (NATIVE) $("fsbox").hidden = true;
else $("fs").onclick = () => { const d = document; d.fullscreenElement ? d.exitFullscreen() : d.documentElement.requestFullscreen?.(); };
if (!NATIVE) $("disc").hidden = true;

/* ---------- Mises à jour automatiques ---------- */
const HAS = n => NATIVE && typeof Android[n] === "function";
let updReady = false;
function showUpd(txt, btn, disabled) {
  $("upd").hidden = false; $("updtx").textContent = txt;
  $("updbtn").textContent = btn; $("updbtn").disabled = !!disabled; $("updbtn").hidden = !btn;
}
window.onUpdateInfo = info => {
  if (info.error) { $("updmsg").textContent = info.error; return; }
  if (info.available) {
    $("updmsg").textContent = "Nouvelle version disponible : 1." + info.latest;
    showUpd("Mise à jour disponible : version 1." + info.latest, "Installer", false);
  } else $("updmsg").textContent = "Vous avez la dernière version.";
};
window.onUpdateProgress = p => showUpd("Téléchargement de la mise à jour… " + p + " %", "", true);
window.onUpdateReady = msg => {
  updReady = true;
  if (msg) showUpd(msg, "Installer", false); else showUpd("Installation : validez sur l'écran Android", "Réinstaller", false);
};
window.onUpdateError = msg => { showUpd(msg, "Réessayer", false); updReady = false; };
$("updbtn").onclick = () => {
  if (!HAS("downloadUpdate")) return;
  if (updReady) Android.installUpdate();
  else { showUpd("Téléchargement de la mise à jour… 0 %", "", true); Android.downloadUpdate(); }
};
$("updcheck").onclick = () => {
  if (!HAS("checkUpdate")) { $("updmsg").textContent = "Cette version de l'appli ne sait pas se mettre à jour : installez-la une fois à la main."; return; }
  $("updmsg").textContent = "Recherche en cours…"; Android.checkUpdate();
};
if (HAS("appInfo")) {
  try { const i = JSON.parse(Android.appInfo()); $("verline").textContent = "Version installée : " + i.versionName + " (n° " + i.versionCode + ")"; } catch(e) {}
  setTimeout(() => { try { Android.checkUpdate(); } catch(e) {} }, 1500);   // recherche automatique au démarrage
}
$("updsec").hidden = !NATIVE;

/* ---------- Diagnostic Bluetooth ---------- */
function runDiag() {
  const o = $("dgout");
  if (!HAS("diag")) { o.textContent = NATIVE ? "Cette version de l'appli n'a pas le diagnostic : remplacez les fichiers .kt et recompilez." : "Disponible dans l'application Android."; return; }
  let d; try { d = JSON.parse(Android.diag()); } catch(e) { o.textContent = "Diagnostic impossible"; return; }
  o.textContent = [
    "Appareil : " + d.model + " (Android API " + d.sdk + ")",
    "Profil clavier Bluetooth : " + (d.proxy ? "prêt" : "NON DISPONIBLE (permission Bluetooth ?)"),
    "Clavier enregistré : " + (d.registered ? "oui" : "NON : ce téléphone refuse le mode clavier"),
    "Ordinateur connecté : " + (d.connected ? "oui (" + d.host + ")" : "NON"),
    "Protocole demandé par l'ordinateur : " + (d.protocol === 0 ? "boot (limité)" : d.protocol === 1 ? "normal" : "pas encore demandé"),
    "Rapports envoyés : " + d.sentOk + " acceptés / " + d.sentFail + " refusés"
  ].join("\n");
}
$("dg").onclick = runDiag;
$("mt").onclick = () => {
  if (!NATIVE) { $("dgout").textContent = "Disponible dans l'application Android."; return; }
  $("dgout").textContent = "Test : le curseur de l'ordinateur doit dessiner un carré…";
  const dirs = [[6, 0], [0, 6], [-6, 0], [0, -6]]; let i = 0, n = 0;
  const iv = setInterval(() => {
    sendMouse(dirs[i][0], dirs[i][1], 0, 0);
    if (++n % 20 === 0) i++;
    if (i >= 4) { clearInterval(iv); setTimeout(() => { runDiag(); $("dgout").textContent += "\nDernier envoi souris : " + (lastMouseResult === 1 ? "accepté" : lastMouseResult === 0 ? "aucun ordinateur connecté" : lastMouseResult === -1 ? "refusé par le Bluetooth" : "souris absente de l'appli"); }, 250); }
  }, 15);
};
$("unp").onclick = () => {
  if (!S.dev) { $("dgout").textContent = "Choisissez d'abord l'ordinateur dans la liste « Appareil Bluetooth »."; return; }
  let ok = false; try { ok = HAS("unpair") && Android.unpair(S.dev); } catch(e) {}
  $("dgout").textContent = ok ? "Appairage oublié sur ce téléphone. Faites de même sur l'ordinateur (supprimer l'appareil), puis ré-appairez et appuyez sur Connecter."
                              : "Impossible automatiquement : utilisez « Réglages Bluetooth », touchez l'ordinateur puis « Oublier ».";
  refreshDevices();
};
$("btset").onclick = () => { if (HAS("openBtSettings")) Android.openBtSettings(); };
$("dgsec").hidden = !NATIVE;

refreshDevices(); renderBt(); render();
</script>
</body>
</html>
